<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blower Controller - Cyan Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #030712;
      color: #f3f4f6;
    }
    .font-tech {
      font-family: 'Orbitron', sans-serif;
    }
    .cyan-glow {
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.15);
    }
    .text-glow {
      text-shadow: 0 0 12px rgba(6, 182, 212, 0.6);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

  <!-- Header -->
  <header class="w-full max-w-md flex justify-between items-center py-2">
    <h1 class="text-xl font-bold tracking-wider font-tech text-cyan-400">BLOWER CTRL</h1>
    <div class="flex items-center space-x-2">
      <span id="status-dot" class="w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444]"></span>
      <span id="status-text" class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Desconectado</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-md space-y-4 my-auto">
    
    <!-- Temperatura Card -->
    <div class="bg-gray-900/80 border border-cyan-500/20 rounded-2xl p-6 text-center cyan-glow backdrop-blur-md">
      <div class="flex justify-center items-baseline space-x-1">
        <span id="temp-display" class="text-6xl font-extrabold font-tech text-cyan-400 text-glow">--</span>
        <span class="text-3xl font-tech text-cyan-500">°C</span>
      </div>
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mt-3">Temperatura Interior</p>
    </div>

    <!-- Indicador de Velocidad -->
    <div class="bg-gray-900/50 border border-gray-800 rounded-xl p-4 flex justify-between items-center">
      <span class="text-sm font-medium text-gray-300">Velocidad actual</span>
      <span id="speed-display" class="text-lg font-bold font-tech text-cyan-400">OFF</span>
    </div>

    <!-- Controles -->
    <div class="bg-gray-900/80 border border-cyan-500/20 rounded-2xl p-5 space-y-5 cyan-glow">
      <!-- Selector Modo -->
      <div class="grid grid-cols-2 gap-2 bg-black/60 p-1 rounded-xl border border-gray-800">
        <button id="btn-auto" onclick="setMode('AUTO')" class="py-2 text-xs font-bold rounded-lg transition-all text-gray-400">Auto</button>
        <button id="btn-manual" onclick="setMode('MANUAL')" class="py-2 text-xs font-bold rounded-lg transition-all bg-cyan-600 text-black font-tech">Manual</button>
      </div>

      <!-- Selector de Velocidad -->
      <div class="space-y-2">
        <div class="flex justify-between text-xs text-gray-400 px-1 font-tech">
          <span>OFF</span>
          <span>1</span>
          <span>2</span>
          <span>3</span>
          <span>4</span>
        </div>
        <input type="range" id="speed-slider" min="0" max="4" value="0" step="1" onchange="changeSpeed(this.value)"
               class="w-full h-2 bg-gray-800 rounded-lg appearance-none cursor-pointer accent-cyan-400">
      </div>
    </div>

    <!-- Botón Conectar -->
    <button id="btn-connect" onclick="toggleConnect()" 
            class="w-full py-3.5 bg-cyan-500 hover:bg-cyan-400 text-black font-bold font-tech rounded-xl transition-all shadow-[0_0_15px_rgba(6,182,212,0.4)]">
      CONECTAR
    </button>
  </main>

  <footer class="text-xs text-gray-600 py-2 font-tech">
    ESP32 IoT Climate Control
  </footer>

  <script>
    let client = null;
    let connected = false;
    const host = "broker.hivemq.com";
    const port = 8000; // WebSocket Port
    const topicTemp = "auto/clima/temperatura";
    const topicCmd = "auto/clima/comando";

    function toggleConnect() {
      if (!connected) {
        const clientId = "web_" + Math.random().toString(16).substr(2, 8);
        client = new Paho.MQTT.Client(host, port, clientId);
        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        client.connect({
          onSuccess: onConnect,
          onFailure: onFailure,
          useSSL: true
        });
      } else {
        client.disconnect();
        onConnectionLost({ errorMessage: "Desconectado manualmente" });
      }
    }

    function onConnect() {
      connected = true;
      document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-cyan-400 shadow-[0_0_10px_#22d3ee]";
      document.getElementById('status-text').innerText = "Conectado";
      document.getElementById('status-text').className = "text-xs text-cyan-400 font-semibold";
      document.getElementById('btn-connect').innerText = "DESCONECTAR";
      document.getElementById('btn-connect').className = "w-full py-3.5 bg-red-900/40 hover:bg-red-800/60 text-red-400 border border-red-500/30 font-bold font-tech rounded-xl transition-all";
      client.subscribe(topicTemp);
    }

    function onFailure(err) {
      alert("Error al conectar con MQTT: " + err.errorMessage);
    }

    function onConnectionLost(resp) {
      connected = false;
      document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444]";
      document.getElementById('status-text').innerText = "Desconectado";
      document.getElementById('status-text').className = "text-xs text-gray-400 font-semibold";
      document.getElementById('btn-connect').innerText = "CONECTAR";
      document.getElementById('btn-connect').className = "w-full py-3.5 bg-cyan-500 hover:bg-cyan-400 text-black font-bold font-tech rounded-xl transition-all shadow-[0_0_15px_rgba(6,182,212,0.4)]";
    }

    function onMessageArrived(msg) {
      if (msg.destinationName === topicTemp) {
        document.getElementById('temp-display').innerText = msg.payloadString;
      }
    }

    function changeSpeed(val) {
      const levels = ["OFF", "NIVEL 1", "NIVEL 2", "NIVEL 3", "MAX"];
      document.getElementById('speed-display').innerText = levels[val];
      if (connected) {
        let message = new Paho.MQTT.Message("SPEED_" + val);
        message.destinationName = topicCmd;
        client.send(message);
      }
    }

    function setMode(mode) {
      if (mode === 'AUTO') {
        document.getElementById('btn-auto').className = "py-2 text-xs font-bold rounded-lg transition-all bg-cyan-600 text-black font-tech";
        document.getElementById('btn-manual').className = "py-2 text-xs font-bold rounded-lg transition-all text-gray-400";
      } else {
        document.getElementById('btn-manual').className = "py-2 text-xs font-bold rounded-lg transition-all bg-cyan-600 text-black font-tech";
        document.getElementById('btn-auto').className = "py-2 text-xs font-bold rounded-lg transition-all text-gray-400";
      }
      if (connected) {
        let message = new Paho.MQTT.Message("MODE_" + mode);
        message.destinationName = topicCmd;
        client.send(message);
      }
    }
  </script>
</body>
</html>
